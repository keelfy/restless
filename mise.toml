[tools]
java = "corretto-25"
node = "24"
bun = "1"

[tasks."mod:build"]
description = "Build the mod jars"
dir = "apps/mod"
run = "./gradlew build"

[tasks."mod:client"]
description = "Run a NeoForge dev client"
dir = "apps/mod"
run = "./gradlew :neoforge:runClient"

[tasks."mod:server"]
description = "Run a NeoForge dev dedicated server"
dir = "apps/mod"
run = "./gradlew :neoforge:runServer"

[tasks."wiki:install"]
description = "Install wiki dependencies"
dir = "apps/frontend"
run = "bun install"

[tasks."wiki:dev"]
description = "Run the wiki dev server"
dir = "apps/frontend"
depends = ["wiki:install"]
run = "bun run dev"

[tasks."wiki:build"]
description = "Build the static wiki (apps/frontend/out)"
dir = "apps/frontend"
depends = ["wiki:install"]
run = "bun run build"
