name: Mod

on:
  push:
    branches: [master]
    tags: ['v*']
    paths: [apps/mod/**, .github/workflows/mod.yml]
  pull_request:
    paths: [apps/mod/**, .github/workflows/mod.yml]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: apps/mod
      - run: ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: restless-neoforge
          path: apps/mod/neoforge/build/libs/*.jar
          if-no-files-found: error

  gametest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: apps/mod
      - run: ./gradlew :neoforge:runGameTestServer

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, gametest]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: apps/mod
      - name: Tag matches mod_version
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
      - run: ./gradlew :neoforge:build
      - uses: actions/upload-artifact@v4
        with:
          name: restless-${{ github.ref_name }}
          path: apps/mod/neoforge/build/libs/*.jar
          if-no-files-found: error
