name: Mod

on:
  push:
    branches: [master]
    paths: [apps/mod/**, .github/workflows/mod.yml]
  pull_request:
    paths: [apps/mod/**, .github/workflows/mod.yml]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: apps/mod
      - run: ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: restless-neoforge
          path: apps/mod/neoforge/build/libs/*.jar
          if-no-files-found: error
