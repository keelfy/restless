name: Sonar

on:
  push:
    branches: [master]
    paths: [apps/mod/**, .github/workflows/sonar.yml]
  pull_request:
    paths: [apps/mod/**, .github/workflows/sonar.yml]
  workflow_dispatch:

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Job-level so the analysis step can be skipped where the secret is absent (fork PRs).
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    defaults:
      run:
        working-directory: apps/mod
    steps:
      - uses: actions/checkout@v4
        with:
          # Sonar needs full history for blame and new-code detection.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: apps/mod
      # `sonar` runs :core tests for coverage and compiles the rest itself.
      - name: SonarQube Cloud analysis
        if: env.SONAR_TOKEN != ''
        run: ./gradlew sonar
