server {
    listen 80;
    root /usr/share/nginx/html;
    absolute_redirect off;

    # Static export: /en/items is items.html, and /en/ is en.html next to the en/ directory.
    rewrite ^/(.+)/$ /$1 permanent;
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }
    error_page 404 /404.html;
}
