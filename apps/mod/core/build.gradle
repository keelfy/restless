// Loader-agnostic logic. Compiles against vanilla Minecraft only;
// anything loader-specific goes through dev.keelfy.restless.platform.
plugins {
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = project.neo_form_version
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Config reads JSON and logs; the vanilla libraries are compile-only for the tests.
    testImplementation 'com.google.code.gson:gson:2.14.0'
    testRuntimeOnly 'org.slf4j:slf4j-api:2.0.17'
    testRuntimeOnly 'com.mojang:logging:1.7.12'
}

test {
    useJUnitPlatform()
}
