// Loader-agnostic logic. Compiles against vanilla Minecraft only;
// anything loader-specific goes through dev.keelfy.restless.platform.
plugins {
	id 'net.neoforged.moddev'
	id 'jacoco'
}

neoForge {
	neoFormVersion = project.neo_form_version
}

repositories {
	mavenCentral()
}

dependencies {
	testImplementation platform('org.junit:junit-bom:5.13.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	// Config reads JSON and logs; the vanilla libraries are compile-only for the tests.
	testImplementation 'com.google.code.gson:gson:2.14.0'
	testRuntimeOnly 'org.slf4j:slf4j-api:2.0.17'
	testRuntimeOnly 'com.mojang:logging:1.7.12'
}

test {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

// Java 25 class files need JaCoCo 0.8.14+.
jacoco {
	toolVersion = '0.8.16'
}

// Sonar reads the XML report from its default location.
jacocoTestReport {
	dependsOn test
	reports.xml.required = true
}
