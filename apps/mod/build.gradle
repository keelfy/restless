plugins {
	id 'com.diffplug.spotless'
	id 'org.sonarqube'
}

// SonarQube Cloud analysis; CI runs `sonar` with SONAR_TOKEN. Coverage comes from :core's JaCoCo report.
sonar {
	properties {
		property 'sonar.host.url', 'https://sonarcloud.io'
		property 'sonar.organization', 'keelfy'
		property 'sonar.projectKey', 'keelfy_restless'
		property 'sonar.projectName', 'Restless'
		// NeoForge payloads need the TYPE/CODEC constants next to the type()/codec() accessors, and GameTests are
		// annotated methods rather than JUnit tests, so these two rules only produce noise there.
		property 'sonar.issue.ignore.multicriteria', 'payloads,gametests'
		property 'sonar.issue.ignore.multicriteria.payloads.ruleKey', 'java:S1845'
		property 'sonar.issue.ignore.multicriteria.payloads.resourceKey', '**/*Payload.java'
		property 'sonar.issue.ignore.multicriteria.gametests.ruleKey', 'java:S2187'
		property 'sonar.issue.ignore.multicriteria.gametests.resourceKey', '**/gametest/**'
	}
}
// The scanner reads compiled classes and the coverage report but does not build them itself.
tasks.named('sonar') {
	dependsOn ':core:jacocoTestReport', ':neoforge:gameTestClasses'
}

// Build scripts and git metadata of the whole build live under the root project.
spotless {
	format('misc') {
		// Explicit globs: a `**` target with `targetExclude` makes the configuration cache walk the whole tree.
		target '*.gradle', '*/*.gradle', '.gitattributes', '.gitignore'

		trimTrailingWhitespace()
		leadingSpacesToTabs()
		endWithNewline()
	}
}

subprojects {
	apply plugin: 'java-library'
	apply plugin: 'com.diffplug.spotless'

	group = mod_group_id
	version = mod_version

	// Mojang ships Java 25 to end users in 26.3.
	java.toolchain.languageVersion = JavaLanguageVersion.of(25)

	base {
		archivesName = "${mod_id}-${project.name}"
	}

	// Spotless resolves the formatter from here.
	repositories {
		mavenCentral()
	}

	// `check` (and so `build`) fails on unformatted code; `spotlessApply` fixes it.
	spotless {
		java {
			importOrder()

			removeUnusedImports()
			forbidModuleImports()
			// expandWildcardImports() and shortenFullyQualifiedTypes() are omitted: in Spotless 8.10.4
			// their classpath state cannot be restored from the configuration cache.

			cleanthat()

			palantirJavaFormat('2.103.0').formatJavadoc(true)

			tableTestFormatter()

			formatAnnotations()
		}
	}

	tasks.withType(JavaCompile).configureEach {
		options.encoding = 'UTF-8'
	}
}
